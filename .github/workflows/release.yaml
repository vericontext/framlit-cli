# Publish to npm when a version tag is pushed (git tag v0.11.0 && git push origin v0.11.0).
#
# Uses npm Trusted Publishing (OIDC): npm trusts this workflow in this
# repository, so no npm token is stored anywhere. The package must list
# vericontext/framlit-cli + release.yml as its trusted publisher on npmjs.com.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      # prepublishOnly also builds and tests before the upload.
      - run: npm publish --provenance --access public
